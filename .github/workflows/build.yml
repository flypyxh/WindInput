      - name: 生成词库数据生成词库数据
        working-directory: WindInputWindInput
        shell: pwshpwsh
        run: .\scripts\dev.ps1 gd.\scripts\dev.ps1 gd

      - name: Release 全构建Release 全构建
        working-directory: WindInputWindInput
        shell: pwshpwsh
        run: .\scripts\dev.ps1 1.\scripts\dev.ps1 1

      - name: 核对产物核对产物
        working-directory: WindInputWindInput
        shell: pwshpwsh
        run: |
          foreach ($f in @('wind_input.exe', 'wind_tsf.dll', 'wind_tsf_x86.dll')) {
            if (-not (Test-Path "build\$f")) { throw "缺少关键产物 build\$f" }
            Write-Host "OK  $f"
          }
          if (-not (Test-Path 'build\data')) { throw '缺少 build\data' }
          $n = (Get-ChildItem build -Recurse -File | Measure-Object).Count
          Write-Host "build\ 文件总数: $n"

      - name: 打便携包打便携包
        working-directory: WindInputWindInput
        shell: pwshpwsh
        run: .\scripts\dev.ps1 9.\scripts\dev.ps1 9

      - name: 上传便携包上传便携包
        uses: actions/upload-artifact@v4actions/upload-artifact@v4
        with:
          name: WindInput-PortableWindInput-Portable
          path: WindInput/dist/*.zipWindInput/dist/*.zip
          if-no-files-found: errorerror
          retention-days: 90
