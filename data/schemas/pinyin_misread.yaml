# 拼音误读表（内置）
#
# 用户打出某个词常见的错误读音时，候选里带出正确拼音提示（莘(shen)莘(shen)）；词库读不出这个词时
# 也以低权重召回到候选里（不占首选、不自动上屏）。召回与提示受设置「纠错与提示 → 提示来源 → 误读」控制。
#
# 列表体每项一个 mapping，一行一项：
#   text   词（两字以上）
#   wrong  错误读音；同一个词有几种常见读错法时写成列表 [a b, c d]
#   right  正确读音
#   读音按音节以空格分隔、不带声调，ü 写作 v。另可写 note（说明）、group（分组），引擎不读；
#   不认识的字段一律忽略。格式不对的项跳过并在日志里告警，不影响其余条目。
#
# 用户可在用户数据目录的 data/pinyin_misread.yaml 用同样格式追加条目，同一「text + wrong」覆盖本表。
#
# 本表由清风输入法自行整理，读音以《现代汉语词典》为准，并逐条核对过随包拼音词库：正确读音是词库
# 登记的读音，错误读音不是；错误拼写本身就是高频词拼写的（如 xinxin = 信心）不收，免得打常用词时
# 候选里混进召回项。未参照其他输入法项目的误读表。
name: pinyin_misread
version: "2026.10.24"
description: 常见误读词的正确读音（内置）
